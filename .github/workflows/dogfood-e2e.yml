name: dogfood-e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"  # daily continuous dogfood, UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: e2e dogfood (real repos, real CLI, no unit tests)
        run: python scripts/dogfood/e2e_dogfood.py
      - name: self-gate this change
        if: github.event_name == 'pull_request'
        run: |
          pr_redteam run --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out verdict.json --actor-app dogfood-e2e \
            --run-id "${{ github.run_id }}" --actor-kind ci \
            --policy policy/policy.pr.json
          jq -e '.verdict != "block"' verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-verdict
          path: verdict.json
          if-no-files-found: ignore
