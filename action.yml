name: "Redteam Doctrine Gate"
description: "Deterministic PR gate: one machine-readable verdict (pass | warn | block) from pinned base/head SHAs. No LLM judge."
author: "tuannx"

inputs:
  base:
    description: "Base commit SHA"
    required: true
  head:
    description: "Head commit SHA"
    required: true
  verdict-path:
    description: "Where to write verdict.json"
    required: false
    default: "verdict.json"
  comment:
    description: "Post the rendered verdict as a PR comment (needs GH_TOKEN with pull-requests: write)"
    required: false
    default: "true"
  python-version:
    description: "Python version"
    required: false
    default: "3.12"

outputs:
  verdict:
    description: "pass, warn or block"
    value: ${{ steps.gate.outputs.verdict }}
  verdict-path:
    description: "Path to verdict.json"
    value: ${{ inputs.verdict-path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install pr_redteam (pinned to this action's ref)
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Run gate
      id: gate
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
        VERDICT_PATH: ${{ inputs.verdict-path }}
      run: |
        rm -f -- "$VERDICT_PATH"
        set +e
        pr_redteam run --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --out "$VERDICT_PATH"
        code=$?
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
          rm -f -- "$VERDICT_PATH"
          exit "$code"
        fi
        if ! pr_redteam verify --verdict "$VERDICT_PATH" > /dev/null; then
          rm -f -- "$VERDICT_PATH"
          exit 1
        fi
        if ! verdict=$(python3 - "$VERDICT_PATH" "$BASE_SHA" "$HEAD_SHA" <<'PY'
        import json
        import sys
        from pathlib import Path

        verdict = json.loads(Path(sys.argv[1]).read_text())
        if verdict["pr"] != {"baseSha": sys.argv[2], "headSha": sys.argv[3]}:
            raise ValueError("verdict does not match the requested SHA pair")
        print(verdict["verdict"])
        PY
        ); then
          rm -f -- "$VERDICT_PATH"
          exit 1
        fi
        if [ "$code" -eq 2 ] && [ "$verdict" != "block" ]; then
          rm -f -- "$VERDICT_PATH"
          exit "$code"
        fi
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "gate verdict: $verdict"
        if [ "$verdict" = "block" ]; then
          exit 2
        fi
        exit "$code"
    - name: Comment verdict on PR
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outputs.verdict != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
        VERDICT_PATH: ${{ inputs.verdict-path }}
        VERDICT: ${{ steps.gate.outputs.verdict }}
      run: |
        if [ ! -f "$VERDICT_PATH" ]; then
          echo "no verdict at $VERDICT_PATH; skipping comment"
          exit 0
        fi
        python3 - "$VERDICT_PATH" "$BASE_SHA" "$HEAD_SHA" "$VERDICT" <<'PY'
        import json
        import sys
        from pathlib import Path

        verdict = json.loads(Path(sys.argv[1]).read_text())
        if verdict["pr"] != {"baseSha": sys.argv[2], "headSha": sys.argv[3]} or verdict["verdict"] != sys.argv[4]:
            raise ValueError("verdict does not match the current invocation")
        PY
        pr_redteam render --verdict "$VERDICT_PATH" > comment.md
        gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

branding:
  icon: "shield"
  color: "red"
