[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr_redteam"
version = "0.1.0"
description = "Deterministic PR hallucination gates: one PR, one verdict.json."
requires-python = ">=3.11"
dependencies = ["jsonschema==4.10.3", "ruff==0.6.9"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "setuptools==84.0.0"]

[project.scripts]
pr_redteam = "pr_redteam.cli:main"

[tool.setuptools]
packages = ["pr_redteam", "schema"]

[tool.setuptools.package-data]
schema = ["verdict.schema.json"]

[tool.ruff]
line-length = 88
